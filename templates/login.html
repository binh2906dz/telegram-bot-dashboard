<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      --accent: #ea580c;
      --accent-light: #fb923c;
      --accent-deep: #c2410c;
      --accent-soft: rgba(234, 88, 12, 0.14);
      --card-bg: rgba(255, 255, 255, 0.94);
      --body-bg: #d8e0ed;
      --border-color: rgba(148, 163, 184, 0.4);
      --text-primary: #0b1220;
      --text-muted: #5c6b82;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .login-card { animation: none !important; }
      body::before, body::after { animation: none !important; opacity: 0.25; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background-color: var(--body-bg);
      background-image:
        radial-gradient(900px 700px at 100% -20%, rgba(234, 88, 12, 0.14), transparent 55%),
        radial-gradient(800px 600px at -10% 110%, rgba(37, 99, 235, 0.11), transparent 50%),
        radial-gradient(600px 500px at 90% 100%, rgba(124, 58, 237, 0.08), transparent 45%),
        linear-gradient(168deg, #eef2f9 0%, var(--body-bg) 42%, #cad6e8 100%);
      background-attachment: fixed;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 340px; height: 340px;
      background: rgba(234, 88, 12, 0.35);
      top: -120px; right: -80px;
      animation: orbFloat 18s ease-in-out infinite;
    }
    body::after {
      width: 280px; height: 280px;
      background: rgba(59, 130, 246, 0.28);
      bottom: -100px; left: -60px;
      animation: orbFloat 22s ease-in-out infinite reverse;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-12px, 16px) scale(1.05); }
    }
    .login-card {
      position: relative;
      z-index: 1;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.97), rgba(248, 250, 252, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 22px;
      padding: 42px 38px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.85) inset,
        0 28px 64px rgba(15, 23, 42, 0.12),
        0 8px 20px rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: cardIn 0.55s var(--ease-out-expo) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .brand-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(145deg, rgba(254, 215, 170, 0.65), rgba(234, 88, 12, 0.18));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      color: var(--accent-deep);
      margin: 0 auto 22px;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.2), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
    }
    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: .86rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
      font-weight: 500;
    }
    .form-control, .form-control:focus {
      background: rgba(255, 255, 255, 0.95);
      border-color: var(--border-color);
      color: var(--text-primary);
      border-radius: 12px;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-label {
      font-size: .84rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .input-group-text {
      background: linear-gradient(180deg, #f8fafc, #f1f5f9);
      border-color: var(--border-color);
      color: var(--text-muted);
      border-radius: 12px 0 0 12px;
    }
    .input-group .form-control {
      border-radius: 0 12px 12px 0;
    }
    .btn-login {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #fb923c 0%, var(--accent) 45%, var(--accent-deep) 100%);
      color: #fff;
      border: none;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      width: 100%;
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.35), 0 1px 0 rgba(255, 255, 255, 0.25) inset;
      transition: transform .2s var(--ease-spring), filter .2s, box-shadow .25s;
    }
    .btn-login::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.35) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.65s var(--ease-out-expo);
      pointer-events: none;
    }
    .btn-login:hover {
      color: #fff;
      filter: brightness(1.05);
      box-shadow: 0 8px 26px rgba(234, 88, 12, 0.4), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
      transform: translateY(-1px);
    }
    .btn-login:hover::after { transform: translateX(100%); }
    .btn-login:active { transform: translateY(0) scale(0.99); }
    .alert-danger {
      background: rgba(239, 68, 68, 0.09);
      border-color: rgba(239, 68, 68, 0.28);
      color: #b91c1c;
      border-radius: 12px;
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <i class="bi bi-fire"></i>
    </div>
    <div class="login-title">DASHBOARD VIP</div>
    <div class="login-subtitle">Đăng nhập để tiếp tục quản trị</div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Nhập tên đăng nhập" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Nhập mật khẩu" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
