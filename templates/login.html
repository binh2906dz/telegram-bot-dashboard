<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --accent: #ff5e00;
      --accent-light: #ff8533;
      --card-bg: #1a1d23;
      --body-bg: #0f1117;
      --border-color: #2a2d35;
    }

    body {
      background-color: var(--body-bg);
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 94, 0, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent);
      margin: 0 auto 20px;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: .85rem;
      color: #666;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-control, .form-control:focus {
      background: #0f1117;
      border-color: var(--border-color);
      color: #e0e0e0;
      border-radius: 10px;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 94, 0, 0.15);
    }

    .form-label {
      font-size: .85rem;
      font-weight: 600;
      color: #aaa;
    }

    .input-group-text {
      background: #0f1117;
      border-color: var(--border-color);
      color: #666;
      border-radius: 10px 0 0 10px;
    }

    .input-group .form-control {
      border-radius: 0 10px 10px 0;
    }

    .btn-login {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      width: 100%;
      transition: background .2s;
    }

    .btn-login:hover {
      background: var(--accent-light);
      color: #fff;
    }

    .alert-danger {
      background: rgba(220, 53, 69, 0.15);
      border-color: rgba(220, 53, 69, 0.3);
      color: #f87171;
      border-radius: 10px;
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <i class="bi bi-fire"></i>
    </div>
    <div class="login-title">DASHBOARD VIP</div>
    <div class="login-subtitle">Đăng nhập để tiếp tục quản trị</div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Nhập tên đăng nhập" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Nhập mật khẩu" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
