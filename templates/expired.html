<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên kết hết hạn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .icon { font-size: 3.5rem; margin-bottom: 20px; }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ff5c5c;
      margin-bottom: 16px;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      max-width: 420px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="icon">⏳</div>
  <h1>Liên kết đã hết hạn</h1>
  <p>{{ message }}</p>
</body>
</html>
