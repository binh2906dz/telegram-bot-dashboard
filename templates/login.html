<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      --accent: #ea580c;
      --accent-light: #fb923c;
      --accent-soft: rgba(232, 93, 4, 0.12);
      --card-bg: #ffffff;
      --body-bg: #eef1f6;
      --border-color: #dde2eb;
      --text-primary: #1c2333;
      --text-muted: #5c6578;
    }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(160deg, #f8fafc 0%, var(--body-bg) 45%, #e8ecf4 100%);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 16px 48px rgba(28, 35, 51, 0.1);
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: var(--accent-soft);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent);
      margin: 0 auto 20px;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: .85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .form-control, .form-control:focus {
      background: #fff;
      border-color: var(--border-color);
      color: var(--text-primary);
      border-radius: 10px;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .form-label {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-group-text {
      background: #f8fafc;
      border-color: var(--border-color);
      color: var(--text-muted);
      border-radius: 10px 0 0 10px;
    }

    .input-group .form-control {
      border-radius: 0 10px 10px 0;
    }

    .btn-login {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      width: 100%;
      transition: background .2s;
    }

    .btn-login:hover {
      background: var(--accent-light);
      color: #fff;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.25);
      color: #b91c1c;
      border-radius: 10px;
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <i class="bi bi-fire"></i>
    </div>
    <div class="login-title">DASHBOARD VIP</div>
    <div class="login-subtitle">Đăng nhập để tiếp tục quản trị</div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Nhập tên đăng nhập" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Nhập mật khẩu" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
