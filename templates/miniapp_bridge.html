<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xác Thực Thành Công</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --card-bg: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --hint-color: var(--tg-theme-hint-color, #999999);
      --btn-color: #4caf50;
      --btn-text: #ffffff;
      --outline-btn: var(--tg-theme-button-color, #2481cc);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 35px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon-success {
      width: 70px;
      height: 70px;
      background-color: #e8f5e9;
      color: #4caf50;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      color: #4caf50;
      font-weight: 700;
    }
    p.subtitle {
      margin: 0 0 30px;
      font-size: 1rem;
      color: var(--hint-color);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      outline: none;
      margin-bottom: 18px;
      transition: opacity 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    
    .btn-primary {
      background-color: var(--btn-color);
      color: var(--btn-text);
      box-shadow: 0 6px 15px rgba(76, 175, 80, 0.3);
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--outline-btn);
      border: 2.5px solid var(--outline-btn);
    }
    .warning-box {
      font-size: 0.9rem;
      color: #e6a23c;
      margin-bottom: 26px;
      line-height: 1.5;
      font-style: italic;
      padding: 0 10px;
    }
    .spinner {
      width: 45px; height: 45px;
      border: 4px solid rgba(76, 175, 80, 0.2);
      border-top-color: #4caf50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #state-loading { display: block; }
    #state-success { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="state-loading">
      <div class="spinner"></div>
      <h2 style="color: var(--text-color);">Đang xác thực...</h2>
      <p class="subtitle">Hệ thống đang tạo thẻ truy cập 24H.</p>
      <div id="error-msg" style="color: #f44336; font-size: 0.95rem; display: none; margin-top: 15px;"></div>
    </div>

    <div id="state-success">
      <div class="icon-success">✓</div>
      <h2>Đã lấy Thẻ 24H!</h2>
      <p class="subtitle">Album của bạn đã sẵn sàng.</p>
      
      <button id="btn-open" class="btn btn-primary">
        <span style="margin-right: 8px;">🌐</span> TRUY CẬP ALBUM
      </button>
      
      <div class="warning-box">
        ⚠️ Lưu ý: Mở trực tiếp trên Telegram có thể không ổn định. Nếu gặp lỗi, hãy dùng nút Copy bên dưới để mở bằng Google Chrome.
      </div>
      
      <button id="btn-copy" class="btn btn-secondary">
        <span style="margin-right: 8px;">📋</span> COPY LINK (DÀNH CHO CHROME)
      </button>
    </div>
  </div>

  <script>
    (function () {
      const ALBUM_ID  = {{ album_id | tojson }};
      const tg = window.Telegram && window.Telegram.WebApp;
      let finalUrl = "";

      function showError(msg) {
        const errEl = document.getElementById('error-msg');
        errEl.innerText = msg;
        errEl.style.display = 'block';
        document.querySelector('.spinner').style.display = 'none';
      }

      async function init() {
        if (!tg) {
          showError('Vui lòng mở từ ứng dụng Telegram.');
          return;
        }
        tg.ready();
        tg.expand();
        
        if(tg.themeParams.bg_color) {
            document.documentElement.style.setProperty('--bg-color', tg.themeParams.secondary_bg_color || '#f4f4f5');
            document.documentElement.style.setProperty('--card-bg', tg.themeParams.bg_color);
            document.documentElement.style.setProperty('--text-color', tg.themeParams.text_color);
            document.documentElement.style.setProperty('--hint-color', tg.themeParams.hint_color);
            document.documentElement.style.setProperty('--outline-btn', tg.themeParams.button_color || '#2481cc');
        }

        const initData = tg.initData || '';
        if (!initData) {
          showError('Không lấy được dữ liệu xác thực.');
          return;
        }

        try {
          // BÍ QUYẾT FIX LỖI FAILED TO FETCH NẰM Ở ĐÂY: DÙNG ĐƯỜNG DẪN TƯƠNG ĐỐI TỰ ĐỘNG
          const resp = await fetch(`/api/generate_token/${encodeURIComponent(ALBUM_ID)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: initData })
          });

          const result = await resp.json();
          if (!result.ok || !result.token) {
            showError(result.error || 'Lỗi tạo liên kết.');
            return;
          }

          // Tự động nhận diện Domain hiện hành (https hay http đều chuẩn 100%)
          const currentDomain = window.location.origin;
          finalUrl = `${currentDomain}/view/album/${encodeURIComponent(ALBUM_ID)}?token=${encodeURIComponent(result.token)}`;

          document.getElementById('state-loading').style.display = 'none';
          document.getElementById('state-success').style.display = 'block';
        } catch (err) {
          showError('Lỗi mạng: Vui lòng kiểm tra kết nối mạng của bạn (Failed to fetch).');
        }
      }

      document.getElementById('btn-open').addEventListener('click', function() {
        if(finalUrl) {
          tg.openLink(finalUrl, { try_instant_view: false });
          setTimeout(() => tg.close(), 300);
        }
      });

      document.getElementById('btn-copy').addEventListener('click', function() {
        if(finalUrl) {
          const el = document.createElement('textarea');
          el.value = finalUrl;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);

          const btn = document.getElementById('btn-copy');
          const originalHtml = btn.innerHTML;
          btn.innerHTML = '<span style="margin-right: 8px;">✅</span> ĐÃ COPY THÀNH CÔNG!';
          btn.style.backgroundColor = 'rgba(76, 175, 80, 0.1)';
          btn.style.borderColor = '#4caf50';
          btn.style.color = '#4caf50';
          
          setTimeout(() => {
            btn.innerHTML = originalHtml;
            btn.style.backgroundColor = 'transparent';
            btn.style.borderColor = 'var(--outline-btn)';
            btn.style.color = 'var(--outline-btn)';
          }, 2500);
        }
      });

      init();
    })();
  </script>
</body>
</html>
